<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniAgent</title>
    <style>
      :root {
        --bg: #0f1116;
        --panel: #171a21;
        --panel-2: #1f232c;
        --line: #2a2f3a;
        --text: #e6e8ee;
        --dim: #8b93a5;
        --accent: #7c8cff;
        --green: #4ade80;
        --red: #f87171;
        --yellow: #fbbf24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--panel);
        flex-wrap: wrap;
      }
      header .brand { font-weight: 700; color: var(--accent); letter-spacing: .3px; }
      header .meta { color: var(--dim); font-size: 12px; }
      header .spacer { flex: 1; }
      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      main { flex: 1; overflow-y: auto; padding: 22px 0; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }
      .msg { margin-bottom: 20px; }
      .msg .who { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
      .bubble {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user .bubble { background: #1d2333; border-color: #2c3550; }
      .bubble pre {
        background: #0b0d12;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .bubble code { background: #0b0d12; padding: 2px 5px; border-radius: 4px; font-size: 12.5px; }
      .tool {
        font-size: 12.5px;
        border-left: 2px solid var(--accent);
        padding: 6px 0 6px 12px;
        margin: 8px 0;
        color: var(--dim);
      }
      .tool .name { color: var(--accent); font-weight: 600; }
      .tool .out { white-space: pre-wrap; max-height: 220px; overflow-y: auto; margin-top: 4px; color: #9aa3b5; }
      .tool.err { border-left-color: var(--red); }
      .notice { font-size: 12.5px; color: var(--yellow); margin: 6px 0; }
      .approval {
        border: 1px solid var(--yellow);
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
        background: #221d10;
      }
      .approval h4 { margin: 0 0 8px; color: var(--yellow); font-size: 13px; }
      .approval pre { background: #14120c; border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
      footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; }
      .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
      textarea {
        flex: 1;
        resize: none;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        height: 54px;
        max-height: 180px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .hint { color: var(--dim); font-size: 11.5px; max-width: 860px; margin: 6px auto 0; }
      .cursor::after { content: '▍'; color: var(--accent); animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .panel {
        position: fixed; right: 16px; top: 58px; width: 380px; max-height: 74vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
        box-shadow: 0 18px 50px rgba(0,0,0,.5); display: none; z-index: 20;
      }
      .panel.open { display: block; }
      .panel h3 { margin: 14px 0 6px; font-size: 13px; color: var(--accent); }
      .panel h3:first-child { margin-top: 0; }
      .panel .item { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .panel .item .d { color: var(--dim); }
      .badge { font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">MiniAgent</span>
      <span class="meta" id="meta">加载中…</span>
      <span class="spacer"></span>
      <button id="btn-panel">工具/技能</button>
      <button id="btn-reset">新会话</button>
      <button id="btn-stop" disabled>停止</button>
    </header>

    <main id="main"><div class="wrap" id="log"></div></main>

    <div class="panel" id="panel"></div>

    <footer>
      <div class="composer">
        <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="btn-send" style="height: 40px; padding: 0 20px">发送</button>
      </div>
      <div class="hint" id="hint"></div>
    </footer>

    <script>
      const $ = (s) => document.querySelector(s);
      const log = $('#log');
      let busy = false;
      let current = null;
      let lastTool = null;

      fetch('/api/info').then((r) => r.json()).then((info) => {
        window.__info = info;
        $('#meta').textContent = `${info.model} · ${info.workspace}`;
        $('#hint').textContent =
          `${info.tools.length} 个工具 · ${info.skills.length} 个技能 · ${info.plugins.length} 个插件` +
          (info.autoApprove ? ' · ⚠ 自动批准已开启' : '');
        renderPanel(info);
      });

      function renderPanel(info) {
        const el = $('#panel');
        const tool = (t) =>
          `<div class="item"><b>${t.name}</b> <span class="badge">${t.risk || 'low'}</span>` +
          `${t.plugin ? ` <span class="badge">${t.plugin}</span>` : ''}<div class="d">${esc(t.description.split('\n')[0])}</div></div>`;
        el.innerHTML =
          `<h3>工具 (${info.tools.length})</h3>${info.tools.map(tool).join('')}` +
          `<h3>技能 (${info.skills.length})</h3>${
            info.skills.map((s) => `<div class="item"><b>${s.name}</b><div class="d">${esc(s.description)}</div></div>`).join('') ||
            '<div class="item d">未安装技能</div>'
          }` +
          `<h3>插件 (${info.plugins.length})</h3>${
            info.plugins.map((p) => `<div class="item"><b>${p.name}</b><div class="d">${esc(p.description)}</div></div>`).join('') ||
            '<div class="item d">未安装插件</div>'
          }`;
      }

      $('#btn-panel').onclick = () => $('#panel').classList.toggle('open');

      function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      }

      function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `<div class="who">${role === 'user' ? '你' : 'MiniAgent'}</div><div class="bubble"></div>`;
        div.querySelector('.bubble').textContent = text || '';
        log.appendChild(div);
        scroll();
        return div.querySelector('.bubble');
      }

      function scroll() {
        $('#main').scrollTop = $('#main').scrollHeight;
      }

      async function send() {
        const input = $('#input');
        const text = input.value.trim();
        if (!text || busy) return;
        input.value = '';
        addMsg('user', text);
        setBusy(true);

        const bubble = addMsg('assistant', '');
        bubble.classList.add('cursor');
        current = { bubble, text: '' };

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const parts = buf.split('\n\n');
            buf = parts.pop();
            for (const part of parts) {
              const line = part.split('\n').find((l) => l.startsWith('data:'));
              if (!line) continue;
              let evt;
              try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
              handleEvent(evt);
            }
          }
        } catch (err) {
          addNotice(`连接失败: ${err.message}`);
        } finally {
          if (current?.bubble) current.bubble.classList.remove('cursor');
          log.querySelectorAll('.cursor').forEach((el) => el.classList.remove('cursor'));
          current = null;
          lastTool = null;
          setBusy(false);
        }
      }

      function handleEvent(evt) {
        switch (evt.type) {
          case 'delta':
            if (!current.text) current.bubble.textContent = '';
            current.text += evt.text;
            current.bubble.textContent = current.text;
            scroll();
            break;
          case 'reasoning':
            break;
          case 'tool_start': {
            const d = document.createElement('div');
            d.className = 'tool';
            d.innerHTML = `<span class="name">⚙ ${esc(evt.name)}</span> <span>${esc(summarize(evt.args))}</span>`;
            log.appendChild(d);
            lastTool = d;
            scroll();
            break;
          }
          case 'tool_end': {
            if (lastTool) {
              const out = document.createElement('div');
              out.className = 'out';
              out.textContent = String(evt.output || '').slice(0, 2000);
              lastTool.appendChild(out);
              if (!evt.ok) lastTool.classList.add('err');
            }
            scroll();
            break;
          }
          case 'approval':
            renderApproval(evt);
            break;
          case 'notice':
            addNotice(evt.text);
            break;
          case 'error':
            addNotice(`错误: ${evt.message}`);
            break;
          case 'done':
            if (current) {
              if (!current.text && evt.text) {
                current.text = evt.text;
              }
              current.bubble.textContent = current.text;
              current.bubble.classList.remove('cursor');
            }
            break;
        }
      }

      function summarize(args) {
        if (!args || typeof args !== 'object') return '';
        return Object.entries(args)
          .map(([k, v]) => `${k}=${typeof v === 'string' ? v.replace(/\n/g, '\\n') : JSON.stringify(v)}`.slice(0, 160))
          .join('  ');
      }

      function addNotice(text) {
        const d = document.createElement('div');
        d.className = 'notice';
        d.textContent = `! ${text}`;
        log.appendChild(d);
        scroll();
      }

      function renderApproval(evt) {
        const d = document.createElement('div');
        d.className = 'approval';
        d.innerHTML =
          `<h4>需要确认 · ${esc(evt.tool)} <span class="badge">风险 ${esc(evt.risk)}</span></h4>` +
          `<pre>${esc(JSON.stringify(evt.args, null, 2))}</pre>` +
          (evt.notes?.length ? `<div class="notice">${evt.notes.map(esc).join('<br>')}</div>` : '');
        const bar = document.createElement('div');
        bar.style.display = 'flex';
        bar.style.gap = '8px';
        const mk = (label, val, primary) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (primary) b.style.borderColor = 'var(--green)';
          b.onclick = async () => {
            bar.remove();
            d.querySelector('h4').textContent = `${evt.tool} · ${label}`;
            await fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: evt.id, approved: val })
            });
          };
          return b;
        };
        bar.appendChild(mk('允许一次', true, true));
        bar.appendChild(mk('拒绝', false, false));
        d.appendChild(bar);
        log.appendChild(d);
        scroll();
      }

      function setBusy(v) {
        busy = v;
        $('#btn-send').disabled = v;
        $('#btn-stop').disabled = !v;
      }

      $('#btn-send').onclick = send;
      $('#btn-stop').onclick = async () => {
        await fetch('/api/stop', { method: 'POST' });
        addNotice('已请求停止');
      };
      $('#btn-reset').onclick = async () => {
        await fetch('/api/reset', { method: 'POST' });
        log.innerHTML = '';
        addNotice('已开始新会话');
      };
      $('#input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      $('#input').focus();
    </script>
  </body>
</html>
