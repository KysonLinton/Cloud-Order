<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>穿搭管家 · CloudOrder</title>
    <style>
      :root {
        --bg: #0f1116;
        --panel: #171a21;
        --panel-2: #1f232c;
        --line: #2a2f3a;
        --text: #e6e8ee;
        --dim: #8b93a5;
        --accent: #7c8cff;
        --green: #4ade80;
        --red: #f87171;
        --yellow: #fbbf24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--panel);
        flex-wrap: wrap;
      }
      header .brand { font-weight: 700; color: var(--accent); letter-spacing: .3px; }
      header .meta { color: var(--dim); font-size: 12px; }
      header .spacer { flex: 1; }
      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      main { flex: 1; overflow-y: auto; padding: 22px 0; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }
      .msg { margin-bottom: 20px; }
      .msg .who { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
      .bubble {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user .bubble { background: #1d2333; border-color: #2c3550; }
      .bubble pre {
        background: #0b0d12;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .bubble code { background: #0b0d12; padding: 2px 5px; border-radius: 4px; font-size: 12.5px; }
      .tool {
        font-size: 12.5px;
        border-left: 2px solid var(--accent);
        padding: 6px 0 6px 12px;
        margin: 8px 0;
        color: var(--dim);
      }
      .tool .name { color: var(--accent); font-weight: 600; }
      .tool .out { white-space: pre-wrap; max-height: 220px; overflow-y: auto; margin-top: 4px; color: #9aa3b5; }
      .tool.err { border-left-color: var(--red); }
      .notice { font-size: 12.5px; color: var(--yellow); margin: 6px 0; }
      .approval {
        border: 1px solid var(--yellow);
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
        background: #221d10;
      }
      .approval h4 { margin: 0 0 8px; color: var(--yellow); font-size: 13px; }
      .approval pre { background: #14120c; border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
      footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; }
      .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
      textarea {
        flex: 1;
        resize: none;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        height: 54px;
        max-height: 180px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .hint { color: var(--dim); font-size: 11.5px; max-width: 860px; margin: 6px auto 0; }
      .icon-btn { height: 54px; width: 46px; padding: 0; font-size: 18px; line-height: 1; flex: none; }
      .atts { max-width: 860px; margin: 0 auto 8px; display: flex; gap: 8px; flex-wrap: wrap; }
      .atts .att { position: relative; width: 54px; height: 54px; border-radius: 8px; border: 1px solid var(--line); background-size: cover; background-position: center; }
      .atts .att button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 50%; font-size: 11px; line-height: 1; border-color: var(--red); color: var(--red); background: var(--panel); }
      .bubble .msg-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .bubble .msg-imgs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
      .cursor::after { content: '▍'; color: var(--accent); animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .panel {
        position: fixed; right: 16px; top: 58px; width: 380px; max-height: 74vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
        box-shadow: 0 18px 50px rgba(0,0,0,.5); display: none; z-index: 20;
      }
      .panel.open { display: block; }
      .panel h3 { margin: 14px 0 6px; font-size: 13px; color: var(--accent); }
      .panel h3:first-child { margin-top: 0; }
      .panel .item { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .panel .item .d { color: var(--dim); }
      .badge { font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--dim); }
      /* 位置 / 天气模块 */
      .env-card {
        display: flex; align-items: center; gap: 12px;
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
        padding: 5px 12px; cursor: pointer; user-select: none; transition: border-color .15s;
      }
      .env-card:hover { border-color: var(--accent); }
      .env-card .temp { font-size: 19px; font-weight: 700; line-height: 1; }
      .env-card .wx { display: flex; flex-direction: column; line-height: 1.25; }
      .env-card .cond { font-size: 12.5px; }
      .env-card .loc { font-size: 11px; color: var(--dim); }
      .env-card .ico { font-size: 22px; }
      .env-card .spin { color: var(--dim); font-size: 12px; }
      .env-card .extra { font-size: 11px; color: var(--dim); border-left: 1px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; line-height: 1.35; }
      .env-card.err { border-color: var(--red); color: var(--dim); }
      @media (max-width: 720px) { .env-card .extra { display: none; } }
      /* 衣柜 */
      .panel.wide { width: 460px; }
      .panel .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      .panel .row input, .panel .row select { flex: 1; min-width: 0; }
      .panel input, .panel select, .panel textarea {
        background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 12.5px;
      }
      .panel input:focus, .panel select:focus, .panel textarea:focus { outline: none; border-color: var(--accent); }
      .wd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .wd-card {
        border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
        background: var(--panel-2); display: flex; flex-direction: column;
      }
      .wd-card .thumb {
        height: 108px; background: #0b0d12 center/cover no-repeat; display: flex;
        align-items: center; justify-content: center; color: #3a4150; font-size: 26px;
      }
      .wd-card .body { padding: 8px 9px; display: flex; flex-direction: column; gap: 4px; }
      .wd-card .nm { font-weight: 600; font-size: 13px; word-break: break-all; }
      .wd-card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
      .wd-card .tags .badge { font-size: 10px; }
      .wd-card .acts { display: flex; gap: 6px; margin-top: 4px; }
      .wd-card .acts button { flex: 1; padding: 3px 0; font-size: 11.5px; }
      .wd-empty { color: var(--dim); font-size: 12.5px; text-align: center; padding: 28px 12px; line-height: 1.9; }
      .modal-mask {
        position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
        align-items: center; justify-content: center; z-index: 40; padding: 20px;
      }
      .modal-mask.open { display: flex; }
      .modal {
        width: 520px; max-width: 100%; max-height: 88vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
        box-shadow: 0 24px 70px rgba(0,0,0,.6);
      }
      .modal h3 { margin: 0 0 14px; font-size: 15px; color: var(--accent); }
      .field { margin-bottom: 11px; }
      .field label { display: block; font-size: 11.5px; color: var(--dim); margin-bottom: 4px; }
      .field input, .field select, .field textarea {
        width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px;
      }
      .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
      .field textarea { resize: vertical; min-height: 54px; }
      .field .hintline { color: var(--dim); font-size: 11px; margin-top: 3px; }
      .img-prev {
        width: 96px; height: 96px; border-radius: 10px; border: 1px dashed var(--line);
        background: #0b0d12 center/cover no-repeat; display: flex; align-items: center;
        justify-content: center; color: #3a4150; font-size: 22px; cursor: pointer; flex: 0 0 auto;
      }
      .modal .bar { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
      .modal .bar.sticky { position: sticky; bottom: 0; background: var(--panel); padding-top: 12px; border-top: 1px solid var(--line); }
      .modal .bar .save { border-color: var(--green); color: var(--green); }
      .modal .bar .del { border-color: var(--red); color: var(--red); margin-right: auto; }
      /* 用户档案 */
      .panel.wider { width: 560px; }
      .pf-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
      .pf-cols .field.full { grid-column: 1 / -1; }
      .pf-note { color: var(--dim); font-size: 11.5px; margin: 0 0 14px; line-height: 1.8; }
      #btn-profile { position: relative; }
      #btn-profile .dot { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
      .pf-empty { color: var(--dim); font-size: 12.5px; text-align: center; padding: 22px 12px; line-height: 1.9; }
      /* 用户反馈（评价飞轮） */
      .modal.wider { width: 720px; }
      .fb-stat { font-size: 12.5px; color: var(--dim); margin: 0 0 14px; line-height: 1.7; }
      .fb-stat b { color: var(--text); }
      .fb-chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
      .fb-empty { color: var(--dim); font-size: 12.5px; padding: 12px 0; line-height: 1.8; }
      .fb-h { font-size: 12.5px; color: var(--accent); margin: 16px 0 8px; }
      .fb-list {
        margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px;
        display: flex; flex-direction: column; gap: 8px; max-height: 30vh; overflow-y: auto;
      }
      .modal .bar.sticky { margin-top: 12px; }
      .fb-item { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--panel-2); font-size: 12.5px; }
      .fb-top { display: flex; align-items: center; gap: 8px; }
      .fb-date { color: var(--dim); font-size: 11px; margin-left: auto; }
      .fb-del { background: none; border: none; color: var(--dim); font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1; }
      .fb-del:hover { color: var(--red); }
      .fb-txt { margin-top: 4px; line-height: 1.6; word-break: break-word; }
      .fb-tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
      .fb-inline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; font-size: 11.5px; color: var(--dim); }
      .fb-inline button { font-size: 11.5px; padding: 3px 9px; }
      .fb-inline .done { color: var(--green); }
      #btn-feedback { position: relative; }
      @media (max-width: 760px) {
        .modal.wider { width: 100%; }
        .pf-cols { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">穿搭管家</span>
      <span class="meta" id="meta">加载中…</span>
      <div class="env-card" id="env-card" title="点击刷新位置与天气"><span class="spin">定位中…</span></div>
      <span class="spacer"></span>
      <button id="btn-profile">档案</button>
      <button id="btn-feedback">反馈</button>
      <button id="btn-wardrobe">衣柜</button>
      <button id="btn-panel">工具/技能</button>
      <button id="btn-reset">新会话</button>
      <button id="btn-stop" disabled>停止</button>
    </header>

    <main id="main"><div class="wrap" id="log"></div></main>

    <div class="panel" id="panel"></div>
    <div class="panel wide" id="wardrobe"></div>
    <div class="modal-mask" id="wd-modal"></div>
    <div class="modal-mask" id="pf-modal"></div>
    <div class="modal-mask" id="fb-modal"></div>

    <footer>
      <div class="atts" id="chat-atts"></div>
      <div class="composer">
        <button id="btn-attach" class="icon-btn" title="附加图片（识别衣物参数）">📎</button>
        <input type="file" id="chat-file" accept="image/*" multiple style="display:none" />
        <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行；可点 📎 附衣服图片让管家识别）"></textarea>
        <button id="btn-send" style="height: 40px; padding: 0 20px">发送</button>
      </div>
      <div class="hint" id="hint"></div>
    </footer>

    <script>
      const $ = (s) => document.querySelector(s);
      const log = $('#log');
      let busy = false;
      let current = null;
      let lastTool = null;

      fetch('/api/info').then((r) => r.json()).then((info) => {
        window.__info = info;
        $('#meta').textContent = `${info.model} · ${info.workspace}`;
        $('#hint').textContent =
          `${info.tools.length} 个工具 · ${info.skills.length} 个技能 · ${info.plugins.length} 个插件` +
          (info.autoApprove ? ' · ⚠ 自动批准已开启' : '');
        renderPanel(info);
        loadProfile(!info.profileConfigured);
        refreshFeedbackCount();
      });

      function renderPanel(info) {
        const el = $('#panel');
        const tool = (t) =>
          `<div class="item"><b>${t.name}</b> <span class="badge">${t.risk || 'low'}</span>` +
          `${t.plugin ? ` <span class="badge">${t.plugin}</span>` : ''}<div class="d">${esc(t.description.split('\n')[0])}</div></div>`;
        el.innerHTML =
          `<h3>工具 (${info.tools.length})</h3>${info.tools.map(tool).join('')}` +
          `<h3>技能 (${info.skills.length})</h3>${
            info.skills.map((s) => `<div class="item"><b>${s.name}</b><div class="d">${esc(s.description)}</div></div>`).join('') ||
            '<div class="item d">未安装技能</div>'
          }` +
          `<h3>插件 (${info.plugins.length})</h3>${
            info.plugins.map((p) => `<div class="item"><b>${p.name}</b><div class="d">${esc(p.description)}</div></div>`).join('') ||
            '<div class="item d">未安装插件</div>'
          }`;
      }

      $('#btn-panel').onclick = () => $('#panel').classList.toggle('open');

      // ---- 位置 / 天气模块 ----
      const wxIcon = (code, isDay) => {
        const c = Number(code);
        if (c === 0) return isDay === false ? '🌙' : '☀️';
        if (c === 1 || c === 2) return isDay === false ? '🌤' : '🌤';
        if (c === 3) return '☁️';
        if (c === 45 || c === 48) return '🌫';
        if (c >= 51 && c <= 67) return '🌦';
        if (c >= 71 && c <= 77) return '🌨';
        if (c >= 80 && c <= 82) return '🌧';
        if (c >= 85 && c <= 86) return '🌨';
        if (c >= 95) return '⛈';
        return '🌡';
      };

      async function loadEnv() {
        const card = $('#env-card');
        card.classList.remove('err');
        card.innerHTML = '<span class="spin">定位中…</span>';
        try {
          const r = await fetch('/api/location-weather');
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          const w = d.weather || {};
          const loc = [d.city, d.district].filter(Boolean).join(' · ') || d.label || '未知位置';
          if (w.error) {
            card.classList.add('err');
            card.innerHTML =
              `<span class="ico">📍</span><div class="wx"><span class="cond">${esc(loc)}</span>` +
              `<span class="loc">天气获取失败</span></div>`;
            return;
          }
          const temp = w.temperature != null ? `${Math.round(w.temperature)}°` : '--';
          const extra = [
            w.tempMin != null && w.tempMax != null ? `今日 ${Math.round(w.tempMin)}~${Math.round(w.tempMax)}°C` : '',
            w.apparentTemperature != null ? `体感 ${Math.round(w.apparentTemperature)}°C` : '',
            w.precipitationProbability != null ? `降水 ${Math.round(w.precipitationProbability)}%` : '',
            w.windSpeed != null ? `风 ${w.windDirection || ''}${Math.round(w.windSpeed)} km/h` : '',
            w.humidity != null ? `湿度 ${Math.round(w.humidity)}%` : '',
            w.uvIndex != null ? `紫外线 ${w.uvIndex}` : ''
          ].filter(Boolean);
          card.innerHTML =
            `<span class="ico">${wxIcon(w.weatherCode, w.isDay)}</span>` +
            `<span class="temp">${temp}</span>` +
            `<div class="wx"><span class="cond">${esc(w.condition || '')}</span>` +
            `<span class="loc">📍 ${esc(loc)}</span></div>` +
            (extra.length ? `<div class="extra">${extra.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : '');
          card.title = (w.hint ? `穿衣提示：${w.hint}\n` : '') + '点击刷新位置与天气';
        } catch (err) {
          card.classList.add('err');
          card.innerHTML = `<span class="ico">📍</span><div class="wx"><span class="cond">位置/天气不可用</span><span class="loc">${esc(err.message)}</span></div>`;
        }
      }
      $('#env-card').onclick = loadEnv;
      loadEnv();

      // ---- 衣柜 ----
      let wdMeta = { categories: [], seasons: ['春', '夏', '秋', '冬'] };
      let wdItems = [];
      let wdEditing = null; // 正在编辑的单品 id；null 表示新增
      let wdImageData = ''; // 新选择的图片 dataURL

      async function loadWardrobe() {
        const el = $('#wardrobe');
        try {
          const r = await fetch('/api/wardrobe');
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          wdItems = d.items || [];
          wdMeta = { categories: d.categories || [], seasons: d.seasons || [] };
          const badge = $('#btn-wardrobe');
          badge.textContent = `衣柜 (${wdItems.length})`;
          renderWardrobe();
        } catch (err) {
          el.innerHTML = `<h3>衣柜</h3><div class="wd-empty">加载失败：${esc(err.message)}</div>`;
        }
      }

      function renderWardrobe() {
        const el = $('#wardrobe');
        if (!wdItems.length) {
          el.innerHTML =
            `<h3>衣柜 (0)</h3>` +
            `<div style="margin-bottom:12px"><button id="wd-add" style="border-color:var(--accent);color:var(--accent)">+ 添加衣物</button></div>` +
            `<div class="wd-empty">衣柜为空。<br>点击上方「+ 添加衣物」录入你的单品（名称、类别、颜色、材质、季节、风格，可上传图片）。<br>录入后，穿搭管家只会从衣柜里挑选衣物来搭配。</div>`;
          $('#wd-add').onclick = () => openWardrobeModal(null);
          return;
        }
        const card = (it) => {
          const tags = [it.category, ...(it.colors || []), ...(it.seasons || []), ...(it.style || [])]
            .filter(Boolean)
            .slice(0, 6)
            .map((t) => `<span class="badge">${esc(t)}</span>`)
            .join('');
          const thumb = it.image
            ? `<div class="thumb" style="background-image:url('/api/wardrobe/image/${esc(it.image.split('/').pop())}')"></div>`
            : `<div class="thumb">👕</div>`;
          return (
            `<div class="wd-card" data-id="${esc(it.id)}">${thumb}` +
            `<div class="body"><div class="nm">${esc(it.name)}</div>` +
            `<div class="tags">${tags}</div>` +
            `<div class="acts"><button class="wd-edit">编辑</button><button class="wd-del">删除</button></div>` +
            `</div></div>`
          );
        };
        el.innerHTML =
          `<h3>衣柜 (${wdItems.length})</h3>` +
          `<div style="margin-bottom:12px"><button id="wd-add" style="border-color:var(--accent);color:var(--accent)">+ 添加衣物</button></div>` +
          `<div class="wd-grid">${wdItems.map(card).join('')}</div>`;
        $('#wd-add').onclick = () => openWardrobeModal(null);
        el.querySelectorAll('.wd-card').forEach((c) => {
          const id = c.dataset.id;
          c.querySelector('.wd-edit').onclick = () => openWardrobeModal(id);
          c.querySelector('.wd-del').onclick = () => deleteWardrobeItem(id);
        });
      }

      function openWardrobeModal(id) {
        wdEditing = id;
        wdImageData = '';
        const it = id ? wdItems.find((x) => x.id === id) : null;
        const catOpts = wdMeta.categories
          .map((c) => `<option value="${esc(c)}"${it && it.category === c ? ' selected' : ''}>${esc(c)}</option>`)
          .join('');
        const seasonBox = wdMeta.seasons
          .map(
            (s) =>

      async function scanWardrobeImage(it) {
        const hint = $('#wd-scan-hint');
        const btn = $('#wd-scan');
        const image = wdImageData || (it && it.image ? it.image : '');
        if (!image) return addNotice('请先上传图片，再点识别');
        btn.disabled = true;
        const old = hint.textContent;
        hint.textContent = '识别中…请稍候（约几秒）';
        try {
          const r = await fetch('/api/analyze-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image, mode: 'clothing' })
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          const p = d.parsed;
          if (!p) {
            hint.textContent = '识别完成，但未返回结构化字段，请手动填写。';
            addNotice('识别结果非结构化，已跳过自动填入');
            return;
          }
          if (p.name && !$('#wd-name').value.trim()) $('#wd-name').value = p.name;
          if (p.category) {
            const opt = [...$('#wd-cat').options].find((o) => o.value === p.category || o.value.includes(p.category));
            if (opt) $('#wd-cat').value = opt.value;
          }
          if (p.colors?.length) $('#wd-colors').value = p.colors.join(', ');
          if (p.material) $('#wd-material').value = p.material;
          if (p.style?.length) $('#wd-style').value = p.style.join(', ');
          if (p.seasons?.length) {
            document.querySelectorAll('.wd-season').forEach((c) => {
              c.checked = p.seasons.includes(c.value);
            });
          }
          if (p.fit) $('#wd-fit').value = p.fit;
          if (p.brand && !$('#wd-brand').value.trim()) $('#wd-brand').value = p.brand;
          const notes = [p.notes, (p.tags || []).length ? `标签：${p.tags.join('、')}` : ''].filter(Boolean).join('\n');
          if (notes && !$('#wd-notes').value.trim()) $('#wd-notes').value = notes;
          const unsure = (p.unsure || []).filter(Boolean);
          hint.textContent = `已自动填入（模型：${d.model}）${unsure.length ? '；没把握的字段：' + unsure.join('、') : ''}`;
          addNotice(`识别完成${p.confidence != null ? `（置信度 ${p.confidence}）` : ''}，已填入表单，请核对后保存`);
        } catch (err) {
          hint.textContent = old;
          addNotice(`识别失败：${err.message}`);
        } finally {
          btn.disabled = false;
        }
      }

      function readImage(file) {
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) return addNotice('图片过大（上限 8MB）');
        const reader = new FileReader();
        reader.onload = () => {
          wdImageData = reader.result;
          $('#wd-prev').style.backgroundImage = `url('${wdImageData}')`;
          $('#wd-prev').textContent = '';
        };
        reader.readAsDataURL(file);
      }

      function closeWardrobeModal() {
        $('#wd-modal').classList.remove('open');
        $('#wd-modal').innerHTML = '';
        wdEditing = null;
        wdImageData = '';
      }

      async function saveWardrobeItem() {
        const name = $('#wd-name').value.trim();
        if (!name) return addNotice('请填写名称');
        const seasons = [...document.querySelectorAll('.wd-season:checked')].map((c) => c.value);
        const payload = {
          name,
          category: $('#wd-cat').value,
          colors: $('#wd-colors').value,
          material: $('#wd-material').value,
          style: $('#wd-style').value,
          seasons,
          fit: $('#wd-fit').value,
          size: $('#wd-size').value,
          brand: $('#wd-brand').value,
          notes: $('#wd-notes').value
        };
        if (wdImageData) payload.image = wdImageData;
        const editing = wdEditing;
        try {
          const r = await fetch(editing ? `/api/wardrobe/${encodeURIComponent(editing)}` : '/api/wardrobe', {
            method: editing ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          closeWardrobeModal();
          await loadWardrobe();
          addNotice(editing ? '已更新衣物' : '已添加衣物');
        } catch (err) {
          addNotice(`保存失败：${err.message}`);
        }
      }

      async function deleteWardrobeItem(id) {
        const it = wdItems.find((x) => x.id === id);
        if (!confirm(`确定删除「${it ? it.name : id}」？此操作不可恢复。`)) return;
        try {
          const r = await fetch(`/api/wardrobe/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          closeWardrobeModal();
          await loadWardrobe();
          addNotice('已删除衣物');
        } catch (err) {
          addNotice(`删除失败：${err.message}`);
        }
      }

      $('#btn-wardrobe').onclick = () => {
        const opened = $('#wardrobe').classList.toggle('open');
        if (opened) loadWardrobe();
      };
      // 深链接：#wardrobe 直接展开衣柜；#wardrobe/new 同时打开发录入窗；#profile 打开档案；#feedback 打开发馈
      async function applyHash() {
        const h = (location.hash || '').replace('#', '');
        if (h.startsWith('profile')) {
          openProfileModal();
        }
        if (h.startsWith('feedback')) {
          await openFeedbackModal();
        }
        if (h.startsWith('wardrobe')) {
          $('#wardrobe').classList.add('open');
          await loadWardrobe();
          if (h === 'wardrobe/new') openWardrobeModal(null);

      }

      // ---- 用户档案（Profile） ----
      let pfFields = [];
      let pfData = {};

      async function loadProfile(autoOpen) {
        try {
          const r = await fetch('/api/profile');
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);

          addNotice(`档案加载失败：${err.message}`);

      function pfInput(f) {

        }

        $('#pf-modal').innerHTML =

      async function saveProfileForm() {
        const patch = {};
        document.querySelectorAll('#pf-modal [data-k]').forEach((el) => {
          patch[el.dataset.k] = el.value;
        });

          const r = await fetch('/api/profile', {

          });

          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);

        if (!confirm('确定清空档案？清空后管家将不再依据你的个人信息推荐。')) return;
        try {
          const r = await fetch('/api/profile', { method: 'DELETE' });

          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);

          await loadProfile(false);

      // ---- 用户反馈（评价飞轮） ----
      let fbCount = 0;
      let fbRatings = [];
      let pendingFeedback = null; // { sc: string, outfit: string }
      const fbLabel = (key) => fbRatings.find((r) => r.key === key) || { icon: '•', label: key || '未知' };

      function mdToHtml(src) {
        const lines = String(src ?? '').split('\n');
        const out = lines.map((raw) => {
          const l = raw.trim();
          if (!l) return '';
          if (l.startsWith('#')) return `<div class="fb-h">${esc(l.replace(/^#+\s*/, ''))}</div>`;
          if (/^[-·•]\s?/.test(l)) return `<div style="padding-left:6px;line-height:1.75">• ${esc(l.replace(/^[-·•]\s?/, ''))}</div>`;
          return `<div style="line-height:1.75">${esc(l)}</div>`;
        });
        return out.join('');
      }

      function fbChips(list) {
        return list.map((t) => `<span class="badge">${esc(t)}</span>`).join('');
      }

      /** 拉取最新评价数据（供弹窗与按钮小红点使用） */
      async function getFeedbackData() {
        const r = await fetch('/api/feedback');
        const d = await r.json();
        if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
        if (d.ratings) fbRatings = d.ratings;
        return d;
      }

      /** 聊天里出现搭配推荐时，在回复下方挂一条快捷评价栏 */
      function maybeOfferFeedback(text) {
        const sc = String(text || '').match(/场合[：:]\s*([^\n，。；（）]{2,10})/)?.[1];
        const hasSig = (sc && /方案|搭配|推荐/.test(text)) || /推荐你|给你搭|可以这样穿/.test(text);
        if (!hasSig) return;
        const outfit = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 300);
        showInlineFeedback({ sc: sc || '', outfit });
        refreshFeedbackCount();
      }

      function showInlineFeedback(ctx) {
        const dup = [...log.querySelectorAll('.fb-inline')].some(
          (el) => el.dataset.outfit === ctx.outfit && Date.now() - Number(el.dataset.at || 0) < 3 * 60 * 1000
        );
        if (dup) return;
        pendingFeedback = ctx;
        const d = document.createElement('div');
        d.className = 'fb-inline';
        d.dataset.outfit = ctx.outfit;
        d.dataset.at = String(Date.now());
        d.innerHTML = '<span>这套怎么样？</span>';
        const mk = (label, key) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = () => openFeedbackModal({ rating: key, ...ctx });
          return b;
        };
        d.appendChild(mk('👍 满意', 'satisfied'));
        d.appendChild(mk('🤔 一般', 'neutral'));
        d.appendChild(mk('👎 不满意', 'unsatisfied'));
        const open = document.createElement('button');
        open.textContent = '反馈';
        open.onclick = () => openFeedbackModal(ctx);
        d.appendChild(open);
        d.appendChild(Object.assign(document.createElement('span'), { textContent: '（点评一下，管家下次会更懂你）' }));
        log.appendChild(d);
        scroll();
      }

          `<div class="field full"><label>这次的搭配（可留空）</label>` +
          `<input id="fb-outfit" placeholder="如：藏青西装外套 + 白衬衫 + 卡其裤" value="${esc(ctx)}" /></div>` +
          `<div class="pf-cols">` +
          `<div class="field"><label>满意度 *</label><select id="fb-rating">` +
          `<option value="">请选择…</option>` +
          fbRatings.map((r) => `<option value="${esc(r.key)}"${sel === r.key ? ' selected' : ''}>${esc(r.label)}</option>`).join('') +
          `</select></div>` +
          `<div class="field"><label>场合（可留空）</label><input id="fb-scenario" value="${esc(preset?.sc || '')}" placeholder="如：通勤 / 约会" /></div>` +

          `<div class="field full"><label>改进建议（想怎么改？）</label><textarea id="fb-suggestion" placeholder="如：上衣太正式了，想休闲一点；颜色别太深"></textarea>` +
          `<div class="hintline">写一句就行——我会把它当成以后的偏好依据（原话保留，不改写）。</div></div>` +
          `<div class="pf-cols">` +
          `<div class="field"><label>要避免的点（逗号分隔）</label><input id="fb-disliked" placeholder="如：太正式, 颜色太深" /></div>` +
          `<div class="field"><label>认可的点（逗号分隔）</label><input id="fb-liked" placeholder="如：版型利落, 配色清爽" /></div>` +
          `</div>` +
          (items.length
            ? `<div class="fb-list"><div class="fb-h">历史评价（${items.length}）</div>${items
                .map(
                  (it) =>
                    `<div class="fb-item" data-id="${esc(it.id)}"><div class="fb-top">` +
                    `<span>${esc(it.icon || '•')} ${esc(it.label || '')}</span>` +
                    (it.scenario ? `<span class="badge">${esc(it.scenario)}</span>` : '') +
                    `<span class="fb-date">${esc(String(it.createdAt || '').slice(5, 10))}</span>` +
                    `<button class="fb-del" title="删除这条">×</button></div>` +
                    (it.outfit ? `<div class="fb-txt" style="color:var(--dim)">本次：${esc(it.outfit)}</div>` : '') +
                    (it.suggestion ? `<div class="fb-txt">改进：${esc(it.suggestion)}</div>` : '') +
                    (it.disliked?.length ? `<div class="fb-tags">${fbChips(it.disliked)}</div>` : '') +

            : '') +
          `<div class="bar sticky">` +
          `<button id="fb-cancel">关闭</button>` +
          `<button class="save" id="fb-save">提交评价</button></div>` +

          b.onclick = () => deleteFeedback(b.closest('.fb-item').dataset.id);

      function closeFeedbackModal() {
        $('#fb-modal').classList.remove('open');
        $('#fb-modal').innerHTML = '';
      }

      async function submitFeedback() {
        const rating = $('#fb-rating').value;
        const suggestion = $('#fb-suggestion').value.trim();
        const outfit = $('#fb-outfit').value.trim();
        if (!rating) return addNotice('请先选择满意度（满意 / 一般 / 不满意）');
        if (!suggestion && !outfit && rating === 'neutral') return addNotice('「一般」的话，写一句想怎么改会更有帮助');
        const parseList = (s) => String(s || '').split(/[,，、/]+/).map((x) => x.trim()).filter(Boolean);
        try {
          const r = await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              rating,
              outfit,
              scenario: $('#fb-scenario').value.trim(),
              suggestion,
              disliked: parseList($('#fb-disliked').value),
              liked: parseList($('#fb-liked').value)
            })
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          addNotice('评价已记录，管家下次推荐会参考它 🎯');
          fbCount = (d.summary?.total) || fbCount + 1;
          refreshFeedbackCount();
          closeFeedbackModal();
        } catch (err) {
          addNotice(`提交失败：${err.message}`);
        }
      }

      async function deleteFeedback(id) {
        if (!confirm('删除这条评价？删除后不再作为偏好依据。')) return;
        try {
          const r = await fetch(`/api/feedback?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          await openFeedbackModal();
          refreshFeedbackCount();
        } catch (err) {
          addNotice(`删除失败：${err.message}`);
        }
      }

      async function refreshFeedbackCount() {
        try {
          const r = await fetch('/api/info');
          const d = await r.json();
          fbCount = d.feedbackCount || 0;
          const btn = $('#btn-feedback');
          btn.innerHTML = fbCount ? `反馈<span class="dot"></span>` : '反馈';
          btn.title = fbCount ? `已记录 ${fbCount} 条评价，点这里查看/补充` : '每次推荐后点评一下，管家会越来越懂你';
        } catch {
          /* 忽略 */
        }
      }

      $('#btn-feedback').onclick = () => openFeedbackModal();
      $('#fb-modal').onclick = (e) => {
        if (e.target.id === 'fb-modal') closeFeedbackModal();
      };
      refreshFeedbackCount();

      function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      }
      function addMsg(role, text, images) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `<div class="who">${role === 'user' ? '你' : '穿搭管家'}</div><div class="bubble"></div>`;
        const bubble = div.querySelector('.bubble');
        bubble.textContent = text || '';
        if (images && images.length) {
          const box = document.createElement('div');
          box.className = 'msg-imgs';
          images.forEach((src) => {
            const img = document.createElement('img');
            img.src = src;
            box.appendChild(img);
          });
          bubble.appendChild(box);
        }
        log.appendChild(div);
        scroll();
        return bubble;
      }

      function scroll() {
        $('#main').scrollTop = $('#main').scrollHeight;
      }

      // ---- 聊天附件（图片） ----
      let attachments = []; // [{ dataUrl, path, url, name }]

      function renderAtts() {
        const box = $('#chat-atts');
        box.innerHTML = attachments
          .map((a, i) => `<div class="att" style="background-image:url('${a.dataUrl}')"><button data-i="${i}" title="移除">×</button></div>`)
          .join('');
        box.querySelectorAll('button').forEach((b) => {
          b.onclick = () => {
            attachments.splice(Number(b.dataset.i), 1);
            renderAtts();
          };
        });
      }

      async function addAttachment(file) {
        if (!file) return;
        if (!/^image\//.test(file.type)) return addNotice('只能附加图片文件');
        if (file.size > 8 * 1024 * 1024) return addNotice(`${file.name}：图片过大（上限 8MB）`);
        if (attachments.length >= 4) return addNotice('最多一次附加 4 张图片');
        const dataUrl = await new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.onerror = rej;
          fr.readAsDataURL(file);
        });
        try {
          const r = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataUrl })
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          attachments.push({ dataUrl, path: d.path, url: d.url, name: file.name });
          renderAtts();
        } catch (err) {
          addNotice(`图片上传失败：${err.message}`);
        }
      }

      $('#btn-attach').onclick = () => $('#chat-file').click();
      $('#chat-file').onchange = async (e) => {
        for (const f of [...e.target.files]) await addAttachment(f);
        e.target.value = '';
      };

      async function send() {
        const input = $('#input');
        const text = input.value.trim();
        if ((!text && !attachments.length) || busy) return;
        const sending = attachments.slice();
        input.value = '';
        attachments = [];
        renderAtts();
        addMsg('user', text, sending.map((a) => a.dataUrl));
        setBusy(true);

        const bubble = addMsg('assistant', '');
        bubble.classList.add('cursor');
        current = { bubble, text: '' };

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, images: sending.map((a) => a.path) })
          });
          if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const parts = buf.split('\n\n');
            buf = parts.pop();
            for (const part of parts) {
              const line = part.split('\n').find((l) => l.startsWith('data:'));
              if (!line) continue;
              let evt;
              try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
              handleEvent(evt);
            }
          }
        } catch (err) {
          addNotice(`连接失败: ${err.message}`);
        } finally {
          if (current?.bubble) current.bubble.classList.remove('cursor');
          log.querySelectorAll('.cursor').forEach((el) => el.classList.remove('cursor'));
          current = null;
          lastTool = null;
          setBusy(false);
        }
      }

      function handleEvent(evt) {
        switch (evt.type) {
          case 'delta':
            if (!current.text) current.bubble.textContent = '';
            current.text += evt.text;
            current.bubble.textContent = current.text;
            scroll();
            break;
          case 'reasoning':
            break;
          case 'tool_start': {
            const d = document.createElement('div');
            d.className = 'tool';
            d.innerHTML = `<span class="name">⚙ ${esc(evt.name)}</span> <span>${esc(summarize(evt.args))}</span>`;
            log.appendChild(d);
            lastTool = d;
            scroll();
            break;
          }
          case 'tool_end': {
            if (lastTool) {
              const out = document.createElement('div');
              out.className = 'out';
              out.textContent = String(evt.output || '').slice(0, 2000);
              lastTool.appendChild(out);
              if (!evt.ok) lastTool.classList.add('err');
            }
            scroll();
            break;
          }
          case 'approval':
            renderApproval(evt);
            break;
          case 'notice':
            addNotice(evt.text);
            break;
          case 'error':
            addNotice(`错误: ${evt.message}`);
            break;
          case 'done':
            if (current) {
              if (!current.text && evt.text) {
                current.text = evt.text;
              }
              current.bubble.textContent = current.text;
              current.bubble.classList.remove('cursor');
            }
            maybeOfferFeedback(String(current?.text || ''));
            break;
        }
      }

      function summarize(args) {
        if (!args || typeof args !== 'object') return '';
        return Object.entries(args)
          .map(([k, v]) => `${k}=${typeof v === 'string' ? v.replace(/\n/g, '\\n') : JSON.stringify(v)}`.slice(0, 160))
          .join('  ');
      }

      function addNotice(text) {
        const d = document.createElement('div');
        d.className = 'notice';
        d.textContent = `! ${text}`;
        log.appendChild(d);
        scroll();
      }

      function renderApproval(evt) {
        const d = document.createElement('div');
        d.className = 'approval';
        d.innerHTML =
          `<h4>需要确认 · ${esc(evt.tool)} <span class="badge">风险 ${esc(evt.risk)}</span></h4>` +
          `<pre>${esc(JSON.stringify(evt.args, null, 2))}</pre>` +
          (evt.notes?.length ? `<div class="notice">${evt.notes.map(esc).join('<br>')}</div>` : '');
        const bar = document.createElement('div');
        bar.style.display = 'flex';
        bar.style.gap = '8px';
        const mk = (label, val, primary) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (primary) b.style.borderColor = 'var(--green)';
          b.onclick = async () => {
            bar.remove();
            d.querySelector('h4').textContent = `${evt.tool} · ${label}`;
            await fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: evt.id, approved: val })
            });
          };
          return b;
        };
        bar.appendChild(mk('允许一次', true, true));
        bar.appendChild(mk('拒绝', false, false));
        d.appendChild(bar);
        log.appendChild(d);
        scroll();
      }

      function setBusy(v) {
        busy = v;
        $('#btn-send').disabled = v;
        $('#btn-stop').disabled = !v;
      }

      $('#btn-send').onclick = send;
      $('#btn-stop').onclick = async () => {
        await fetch('/api/stop', { method: 'POST' });
        addNotice('已请求停止');
      };
      $('#btn-reset').onclick = async () => {
        await fetch('/api/reset', { method: 'POST' });
        log.innerHTML = '';
        addNotice('已开始新会话');
      };
      $('#input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      $('#input').focus();
    </script>
  </body>
</html>
