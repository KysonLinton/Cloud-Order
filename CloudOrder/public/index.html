<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>穿搭管家 · CloudOrder</title>
    <style>
      :root {
        --bg: #0f1116;
        --panel: #171a21;
        --panel-2: #1f232c;
        --line: #2a2f3a;
        --text: #e6e8ee;
        --dim: #8b93a5;
        --accent: #7c8cff;
        --green: #4ade80;
        --red: #f87171;
        --yellow: #fbbf24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--panel);
        flex-wrap: wrap;
      }
      header .brand { font-weight: 700; color: var(--accent); letter-spacing: .3px; }
      header .meta { color: var(--dim); font-size: 12px; }
      header .spacer { flex: 1; }
      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      main { flex: 1; overflow-y: auto; padding: 22px 0; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }
      .msg { margin-bottom: 20px; }
      .msg .who { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
      .bubble {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user .bubble { background: #1d2333; border-color: #2c3550; }
      .bubble pre {
        background: #0b0d12;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .bubble code { background: #0b0d12; padding: 2px 5px; border-radius: 4px; font-size: 12.5px; }
      .tool {
        font-size: 12.5px;
        border-left: 2px solid var(--accent);
        padding: 6px 0 6px 12px;
        margin: 8px 0;
        color: var(--dim);
      }
      .tool .name { color: var(--accent); font-weight: 600; }
      .tool .out { white-space: pre-wrap; max-height: 220px; overflow-y: auto; margin-top: 4px; color: #9aa3b5; }
      .tool.err { border-left-color: var(--red); }
      .notice { font-size: 12.5px; color: var(--yellow); margin: 6px 0; }
      .approval {
        border: 1px solid var(--yellow);
        border-radius: 10px;
        padding: 12px;
        margin: 10px 0;
        background: #221d10;
      }
      .approval h4 { margin: 0 0 8px; color: var(--yellow); font-size: 13px; }
      .approval pre { background: #14120c; border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 6px 0; }
      footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; }
      .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
      textarea {
        flex: 1;
        resize: none;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        height: 54px;
        max-height: 180px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .hint { color: var(--dim); font-size: 11.5px; max-width: 860px; margin: 6px auto 0; }
      .cursor::after { content: '▍'; color: var(--accent); animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .panel {
        position: fixed; right: 16px; top: 58px; width: 380px; max-height: 74vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
        box-shadow: 0 18px 50px rgba(0,0,0,.5); display: none; z-index: 20;
      }
      .panel.open { display: block; }
      .panel h3 { margin: 14px 0 6px; font-size: 13px; color: var(--accent); }
      .panel h3:first-child { margin-top: 0; }
      .panel .item { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .panel .item .d { color: var(--dim); }
      .badge { font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--dim); }
      /* 位置 / 天气模块 */
      .env-card {
        display: flex; align-items: center; gap: 12px;
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
        padding: 5px 12px; cursor: pointer; user-select: none; transition: border-color .15s;
      }
      .env-card:hover { border-color: var(--accent); }
      .env-card .temp { font-size: 19px; font-weight: 700; line-height: 1; }
      .env-card .wx { display: flex; flex-direction: column; line-height: 1.25; }
      .env-card .cond { font-size: 12.5px; }
      .env-card .loc { font-size: 11px; color: var(--dim); }
      .env-card .ico { font-size: 22px; }
      .env-card .spin { color: var(--dim); font-size: 12px; }
      .env-card .extra { font-size: 11px; color: var(--dim); border-left: 1px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; line-height: 1.35; }
      .env-card.err { border-color: var(--red); color: var(--dim); }
      @media (max-width: 720px) { .env-card .extra { display: none; } }
      /* 衣柜 */
      .panel.wide { width: 460px; }
      .panel .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      .panel .row input, .panel .row select { flex: 1; min-width: 0; }
      .panel input, .panel select, .panel textarea {
        background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 12.5px;
      }
      .panel input:focus, .panel select:focus, .panel textarea:focus { outline: none; border-color: var(--accent); }
      .wd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .wd-card {
        border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
        background: var(--panel-2); display: flex; flex-direction: column;
      }
      .wd-card .thumb {
        height: 108px; background: #0b0d12 center/cover no-repeat; display: flex;
        align-items: center; justify-content: center; color: #3a4150; font-size: 26px;
      }
      .wd-card .body { padding: 8px 9px; display: flex; flex-direction: column; gap: 4px; }
      .wd-card .nm { font-weight: 600; font-size: 13px; word-break: break-all; }
      .wd-card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
      .wd-card .tags .badge { font-size: 10px; }
      .wd-card .acts { display: flex; gap: 6px; margin-top: 4px; }
      .wd-card .acts button { flex: 1; padding: 3px 0; font-size: 11.5px; }
      .wd-empty { color: var(--dim); font-size: 12.5px; text-align: center; padding: 28px 12px; line-height: 1.9; }
      .modal-mask {
        position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
        align-items: center; justify-content: center; z-index: 40; padding: 20px;
      }
      .modal-mask.open { display: flex; }
      .modal {
        width: 520px; max-width: 100%; max-height: 88vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
        box-shadow: 0 24px 70px rgba(0,0,0,.6);
      }
      .modal h3 { margin: 0 0 14px; font-size: 15px; color: var(--accent); }
      .field { margin-bottom: 11px; }
      .field label { display: block; font-size: 11.5px; color: var(--dim); margin-bottom: 4px; }
      .field input, .field select, .field textarea {
        width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px;
      }
      .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
      .field textarea { resize: vertical; min-height: 54px; }
      .field .hintline { color: var(--dim); font-size: 11px; margin-top: 3px; }
      .img-prev {
        width: 96px; height: 96px; border-radius: 10px; border: 1px dashed var(--line);
        background: #0b0d12 center/cover no-repeat; display: flex; align-items: center;
        justify-content: center; color: #3a4150; font-size: 22px; cursor: pointer; flex: 0 0 auto;
      }
      .modal .bar { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
      .modal .bar .save { border-color: var(--green); color: var(--green); }
      .modal .bar .del { border-color: var(--red); color: var(--red); margin-right: auto; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">穿搭管家</span>
      <span class="meta" id="meta">加载中…</span>
      <div class="env-card" id="env-card" title="点击刷新位置与天气"><span class="spin">定位中…</span></div>
      <span class="spacer"></span>
      <button id="btn-wardrobe">衣柜</button>
      <button id="btn-panel">工具/技能</button>
      <button id="btn-reset">新会话</button>
      <button id="btn-stop" disabled>停止</button>
    </header>

    <main id="main"><div class="wrap" id="log"></div></main>

    <div class="panel" id="panel"></div>
    <div class="panel wide" id="wardrobe"></div>
    <div class="modal-mask" id="wd-modal"></div>

    <footer>
      <div class="composer">
        <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="btn-send" style="height: 40px; padding: 0 20px">发送</button>
      </div>
      <div class="hint" id="hint"></div>
    </footer>

    <script>
      const $ = (s) => document.querySelector(s);
      const log = $('#log');
      let busy = false;
      let current = null;
      let lastTool = null;

      fetch('/api/info').then((r) => r.json()).then((info) => {
        window.__info = info;
        $('#meta').textContent = `${info.model} · ${info.workspace}`;
        $('#hint').textContent =
          `${info.tools.length} 个工具 · ${info.skills.length} 个技能 · ${info.plugins.length} 个插件` +
          (info.autoApprove ? ' · ⚠ 自动批准已开启' : '');
        renderPanel(info);
      });

      function renderPanel(info) {
        const el = $('#panel');
        const tool = (t) =>
          `<div class="item"><b>${t.name}</b> <span class="badge">${t.risk || 'low'}</span>` +
          `${t.plugin ? ` <span class="badge">${t.plugin}</span>` : ''}<div class="d">${esc(t.description.split('\n')[0])}</div></div>`;
        el.innerHTML =
          `<h3>工具 (${info.tools.length})</h3>${info.tools.map(tool).join('')}` +
          `<h3>技能 (${info.skills.length})</h3>${
            info.skills.map((s) => `<div class="item"><b>${s.name}</b><div class="d">${esc(s.description)}</div></div>`).join('') ||
            '<div class="item d">未安装技能</div>'
          }` +
          `<h3>插件 (${info.plugins.length})</h3>${
            info.plugins.map((p) => `<div class="item"><b>${p.name}</b><div class="d">${esc(p.description)}</div></div>`).join('') ||
            '<div class="item d">未安装插件</div>'
          }`;
      }

      $('#btn-panel').onclick = () => $('#panel').classList.toggle('open');

      // ---- 位置 / 天气模块 ----
      const wxIcon = (code, isDay) => {
        const c = Number(code);
        if (c === 0) return isDay === false ? '🌙' : '☀️';
        if (c === 1 || c === 2) return isDay === false ? '🌤' : '🌤';
        if (c === 3) return '☁️';
        if (c === 45 || c === 48) return '🌫';
        if (c >= 51 && c <= 67) return '🌦';
        if (c >= 71 && c <= 77) return '🌨';
        if (c >= 80 && c <= 82) return '🌧';
        if (c >= 85 && c <= 86) return '🌨';
        if (c >= 95) return '⛈';
        return '🌡';
      };

      async function loadEnv() {
        const card = $('#env-card');
        card.classList.remove('err');
        card.innerHTML = '<span class="spin">定位中…</span>';
        try {
          const r = await fetch('/api/location-weather');
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          const w = d.weather || {};
          const loc = [d.city, d.district].filter(Boolean).join(' · ') || d.label || '未知位置';
          if (w.error) {
            card.classList.add('err');
            card.innerHTML =
              `<span class="ico">📍</span><div class="wx"><span class="cond">${esc(loc)}</span>` +
              `<span class="loc">天气获取失败</span></div>`;
            return;
          }
          const temp = w.temperature != null ? `${Math.round(w.temperature)}°` : '--';
          const extra = [
            w.tempMin != null && w.tempMax != null ? `今日 ${Math.round(w.tempMin)}~${Math.round(w.tempMax)}°C` : '',
            w.apparentTemperature != null ? `体感 ${Math.round(w.apparentTemperature)}°C` : '',
            w.precipitationProbability != null ? `降水 ${Math.round(w.precipitationProbability)}%` : '',
            w.windSpeed != null ? `风 ${w.windDirection || ''}${Math.round(w.windSpeed)} km/h` : '',
            w.humidity != null ? `湿度 ${Math.round(w.humidity)}%` : '',
            w.uvIndex != null ? `紫外线 ${w.uvIndex}` : ''
          ].filter(Boolean);
          card.innerHTML =
            `<span class="ico">${wxIcon(w.weatherCode, w.isDay)}</span>` +
            `<span class="temp">${temp}</span>` +
            `<div class="wx"><span class="cond">${esc(w.condition || '')}</span>` +
            `<span class="loc">📍 ${esc(loc)}</span></div>` +
            (extra.length ? `<div class="extra">${extra.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : '');
          card.title = (w.hint ? `穿衣提示：${w.hint}\n` : '') + '点击刷新位置与天气';
        } catch (err) {
          card.classList.add('err');
          card.innerHTML = `<span class="ico">📍</span><div class="wx"><span class="cond">位置/天气不可用</span><span class="loc">${esc(err.message)}</span></div>`;
        }
      }
      $('#env-card').onclick = loadEnv;
      loadEnv();

      // ---- 衣柜 ----
      let wdMeta = { categories: [], seasons: ['春', '夏', '秋', '冬'] };
      let wdItems = [];
      let wdEditing = null; // 正在编辑的单品 id；null 表示新增
      let wdImageData = ''; // 新选择的图片 dataURL

      async function loadWardrobe() {
        const el = $('#wardrobe');
        try {
          const r = await fetch('/api/wardrobe');
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          wdItems = d.items || [];
          wdMeta = { categories: d.categories || [], seasons: d.seasons || [] };
          const badge = $('#btn-wardrobe');
          badge.textContent = `衣柜 (${wdItems.length})`;
          renderWardrobe();
        } catch (err) {
          el.innerHTML = `<h3>衣柜</h3><div class="wd-empty">加载失败：${esc(err.message)}</div>`;
        }
      }

      function renderWardrobe() {
        const el = $('#wardrobe');
        if (!wdItems.length) {
          el.innerHTML =
            `<h3>衣柜 (0)</h3>` +
            `<div style="margin-bottom:12px"><button id="wd-add" style="border-color:var(--accent);color:var(--accent)">+ 添加衣物</button></div>` +
            `<div class="wd-empty">衣柜为空。<br>点击上方「+ 添加衣物」录入你的单品（名称、类别、颜色、材质、季节、风格，可上传图片）。<br>录入后，穿搭管家只会从衣柜里挑选衣物来搭配。</div>`;
          $('#wd-add').onclick = () => openWardrobeModal(null);
          return;
        }
        const card = (it) => {
          const tags = [it.category, ...(it.colors || []), ...(it.seasons || []), ...(it.style || [])]
            .filter(Boolean)
            .slice(0, 6)
            .map((t) => `<span class="badge">${esc(t)}</span>`)
            .join('');
          const thumb = it.image
            ? `<div class="thumb" style="background-image:url('/api/wardrobe/image/${esc(it.image.split('/').pop())}')"></div>`
            : `<div class="thumb">👕</div>`;
          return (
            `<div class="wd-card" data-id="${esc(it.id)}">${thumb}` +
            `<div class="body"><div class="nm">${esc(it.name)}</div>` +
            `<div class="tags">${tags}</div>` +
            `<div class="acts"><button class="wd-edit">编辑</button><button class="wd-del">删除</button></div>` +
            `</div></div>`
          );
        };
        el.innerHTML =
          `<h3>衣柜 (${wdItems.length})</h3>` +
          `<div style="margin-bottom:12px"><button id="wd-add" style="border-color:var(--accent);color:var(--accent)">+ 添加衣物</button></div>` +
          `<div class="wd-grid">${wdItems.map(card).join('')}</div>`;
        $('#wd-add').onclick = () => openWardrobeModal(null);
        el.querySelectorAll('.wd-card').forEach((c) => {
          const id = c.dataset.id;
          c.querySelector('.wd-edit').onclick = () => openWardrobeModal(id);
          c.querySelector('.wd-del').onclick = () => deleteWardrobeItem(id);
        });
      }

      function openWardrobeModal(id) {
        wdEditing = id;
        wdImageData = '';
        const it = id ? wdItems.find((x) => x.id === id) : null;
        const catOpts = wdMeta.categories
          .map((c) => `<option value="${esc(c)}"${it && it.category === c ? ' selected' : ''}>${esc(c)}</option>`)
          .join('');
        const seasonBox = wdMeta.seasons
          .map(
            (s) =>
              `<label style="font-size:12px;color:var(--dim);display:inline-flex;gap:4px;align-items:center;margin-right:10px">` +
              `<input type="checkbox" class="wd-season" value="${esc(s)}"${it && (it.seasons || []).includes(s) ? ' checked' : ''}/>${esc(s)}</label>`
          )
          .join('');
        const prev = it && it.image ? `background-image:url('/api/wardrobe/image/${esc(it.image.split('/').pop())}')` : '';
        $('#wd-modal').innerHTML =
          `<div class="modal">` +
          `<h3>${it ? '编辑衣物' : '添加衣物'}</h3>` +
          `<div class="field"><label>图片（可选，点击上传）</label>` +
          `<div style="display:flex;gap:12px;align-items:center">` +
          `<div class="img-prev" id="wd-prev" style="${prev}">${it && it.image ? '' : '📷'}</div>` +
          `<div style="flex:1"><input type="file" id="wd-file" accept="image/*" />` +
          `<div class="hintline">支持 png/jpg/webp/gif，最大 8MB。</div></div></div></div>` +
          `<div class="field"><label>名称 *</label><input id="wd-name" value="${it ? esc(it.name) : ''}" placeholder="如：白色府绸衬衫" /></div>` +
          `<div class="field"><label>类别</label><select id="wd-cat"><option value="">（未分类）</option>${catOpts}</select></div>` +
          `<div class="field"><label>颜色（逗号分隔）</label><input id="wd-colors" value="${it ? esc((it.colors || []).join(', ')) : ''}" placeholder="如：白, 米色" /></div>` +
          `<div class="field"><label>材质</label><input id="wd-material" value="${it ? esc(it.material || '') : ''}" placeholder="如：棉 / 羊毛 / 真丝" /></div>` +
          `<div class="field"><label>风格（逗号分隔）</label><input id="wd-style" value="${it ? esc((it.style || []).join(', ')) : ''}" placeholder="如：简约, 通勤" /></div>` +
          `<div class="field"><label>适合季节</label><div>${seasonBox}</div></div>` +
          `<div class="field"><label>版型</label><input id="wd-fit" value="${it ? esc(it.fit || '') : ''}" placeholder="如：修身 / 直筒 / 宽松" /></div>` +
          `<div class="field"><label>尺码</label><input id="wd-size" value="${it ? esc(it.size || '') : ''}" placeholder="如：M / 39" /></div>` +
          `<div class="field"><label>品牌</label><input id="wd-brand" value="${it ? esc(it.brand || '') : ''}" /></div>` +
          `<div class="field"><label>备注</label><textarea id="wd-notes" placeholder="新旧程度、搭配注意等">${it ? esc(it.notes || '') : ''}</textarea></div>` +
          `<div class="bar">` +
          (it ? `<button class="del" id="wd-del-btn">删除</button>` : '') +
          `<button id="wd-cancel">取消</button><button class="save" id="wd-save">保存</button></div>` +
          `</div>`;
        $('#wd-modal').classList.add('open');
        $('#wd-prev').onclick = () => $('#wd-file').click();
        $('#wd-file').onchange = (e) => readImage(e.target.files[0]);
        $('#wd-cancel').onclick = closeWardrobeModal;
        $('#wd-save').onclick = saveWardrobeItem;
        if (it) $('#wd-del-btn').onclick = () => deleteWardrobeItem(it.id);
      }

      function readImage(file) {
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) return addNotice('图片过大（上限 8MB）');
        const reader = new FileReader();
        reader.onload = () => {
          wdImageData = reader.result;
          $('#wd-prev').style.backgroundImage = `url('${wdImageData}')`;
          $('#wd-prev').textContent = '';
        };
        reader.readAsDataURL(file);
      }

      function closeWardrobeModal() {
        $('#wd-modal').classList.remove('open');
        $('#wd-modal').innerHTML = '';
        wdEditing = null;
        wdImageData = '';
      }

      async function saveWardrobeItem() {
        const name = $('#wd-name').value.trim();
        if (!name) return addNotice('请填写名称');
        const seasons = [...document.querySelectorAll('.wd-season:checked')].map((c) => c.value);
        const payload = {
          name,
          category: $('#wd-cat').value,
          colors: $('#wd-colors').value,
          material: $('#wd-material').value,
          style: $('#wd-style').value,
          seasons,
          fit: $('#wd-fit').value,
          size: $('#wd-size').value,
          brand: $('#wd-brand').value,
          notes: $('#wd-notes').value
        };
        if (wdImageData) payload.image = wdImageData;
        const editing = wdEditing;
        try {
          const r = await fetch(editing ? `/api/wardrobe/${encodeURIComponent(editing)}` : '/api/wardrobe', {
            method: editing ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          closeWardrobeModal();
          await loadWardrobe();
          addNotice(editing ? '已更新衣物' : '已添加衣物');
        } catch (err) {
          addNotice(`保存失败：${err.message}`);
        }
      }

      async function deleteWardrobeItem(id) {
        const it = wdItems.find((x) => x.id === id);
        if (!confirm(`确定删除「${it ? it.name : id}」？此操作不可恢复。`)) return;
        try {
          const r = await fetch(`/api/wardrobe/${encodeURIComponent(id)}`, { method: 'DELETE' });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
          closeWardrobeModal();
          await loadWardrobe();
          addNotice('已删除衣物');
        } catch (err) {
          addNotice(`删除失败：${err.message}`);
        }
      }

      $('#btn-wardrobe').onclick = () => {
        const opened = $('#wardrobe').classList.toggle('open');
        if (opened) loadWardrobe();
      };
      // 深链接：#wardrobe 直接展开衣柜；#wardrobe/new 同时打开发录入窗
      async function applyHash() {
        const h = (location.hash || '').replace('#', '');
        if (h.startsWith('wardrobe')) {
          $('#wardrobe').classList.add('open');
          await loadWardrobe();
          if (h === 'wardrobe/new') openWardrobeModal(null);
        }
      }
      window.addEventListener('hashchange', applyHash);
      $('#wd-modal').onclick = (e) => {
        if (e.target.id === 'wd-modal') closeWardrobeModal();
      };
      loadWardrobe();
      applyHash();

      function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      }

      function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `<div class="who">${role === 'user' ? '你' : '穿搭管家'}</div><div class="bubble"></div>`;
        div.querySelector('.bubble').textContent = text || '';
        log.appendChild(div);
        scroll();
        return div.querySelector('.bubble');
      }

      function scroll() {
        $('#main').scrollTop = $('#main').scrollHeight;
      }

      async function send() {
        const input = $('#input');
        const text = input.value.trim();
        if (!text || busy) return;
        input.value = '';
        addMsg('user', text);
        setBusy(true);

        const bubble = addMsg('assistant', '');
        bubble.classList.add('cursor');
        current = { bubble, text: '' };

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const parts = buf.split('\n\n');
            buf = parts.pop();
            for (const part of parts) {
              const line = part.split('\n').find((l) => l.startsWith('data:'));
              if (!line) continue;
              let evt;
              try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
              handleEvent(evt);
            }
          }
        } catch (err) {
          addNotice(`连接失败: ${err.message}`);
        } finally {
          if (current?.bubble) current.bubble.classList.remove('cursor');
          log.querySelectorAll('.cursor').forEach((el) => el.classList.remove('cursor'));
          current = null;
          lastTool = null;
          setBusy(false);
        }
      }

      function handleEvent(evt) {
        switch (evt.type) {
          case 'delta':
            if (!current.text) current.bubble.textContent = '';
            current.text += evt.text;
            current.bubble.textContent = current.text;
            scroll();
            break;
          case 'reasoning':
            break;
          case 'tool_start': {
            const d = document.createElement('div');
            d.className = 'tool';
            d.innerHTML = `<span class="name">⚙ ${esc(evt.name)}</span> <span>${esc(summarize(evt.args))}</span>`;
            log.appendChild(d);
            lastTool = d;
            scroll();
            break;
          }
          case 'tool_end': {
            if (lastTool) {
              const out = document.createElement('div');
              out.className = 'out';
              out.textContent = String(evt.output || '').slice(0, 2000);
              lastTool.appendChild(out);
              if (!evt.ok) lastTool.classList.add('err');
            }
            scroll();
            break;
          }
          case 'approval':
            renderApproval(evt);
            break;
          case 'notice':
            addNotice(evt.text);
            break;
          case 'error':
            addNotice(`错误: ${evt.message}`);
            break;
          case 'done':
            if (current) {
              if (!current.text && evt.text) {
                current.text = evt.text;
              }
              current.bubble.textContent = current.text;
              current.bubble.classList.remove('cursor');
            }
            break;
        }
      }

      function summarize(args) {
        if (!args || typeof args !== 'object') return '';
        return Object.entries(args)
          .map(([k, v]) => `${k}=${typeof v === 'string' ? v.replace(/\n/g, '\\n') : JSON.stringify(v)}`.slice(0, 160))
          .join('  ');
      }

      function addNotice(text) {
        const d = document.createElement('div');
        d.className = 'notice';
        d.textContent = `! ${text}`;
        log.appendChild(d);
        scroll();
      }

      function renderApproval(evt) {
        const d = document.createElement('div');
        d.className = 'approval';
        d.innerHTML =
          `<h4>需要确认 · ${esc(evt.tool)} <span class="badge">风险 ${esc(evt.risk)}</span></h4>` +
          `<pre>${esc(JSON.stringify(evt.args, null, 2))}</pre>` +
          (evt.notes?.length ? `<div class="notice">${evt.notes.map(esc).join('<br>')}</div>` : '');
        const bar = document.createElement('div');
        bar.style.display = 'flex';
        bar.style.gap = '8px';
        const mk = (label, val, primary) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (primary) b.style.borderColor = 'var(--green)';
          b.onclick = async () => {
            bar.remove();
            d.querySelector('h4').textContent = `${evt.tool} · ${label}`;
            await fetch('/api/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: evt.id, approved: val })
            });
          };
          return b;
        };
        bar.appendChild(mk('允许一次', true, true));
        bar.appendChild(mk('拒绝', false, false));
        d.appendChild(bar);
        log.appendChild(d);
        scroll();
      }

      function setBusy(v) {
        busy = v;
        $('#btn-send').disabled = v;
        $('#btn-stop').disabled = !v;
      }

      $('#btn-send').onclick = send;
      $('#btn-stop').onclick = async () => {
        await fetch('/api/stop', { method: 'POST' });
        addNotice('已请求停止');
      };
      $('#btn-reset').onclick = async () => {
        await fetch('/api/reset', { method: 'POST' });
        log.innerHTML = '';
        addNotice('已开始新会话');
      };
      $('#input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      $('#input').focus();
    </script>
  </body>
</html>
